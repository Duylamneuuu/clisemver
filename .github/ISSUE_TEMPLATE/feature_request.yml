name: Feature request
description: Propose a compatibility rule, parser shape, or integration
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What CLI compatibility problem cannot clisemver handle today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal help example
      description: Prefer a small synthetic example over a full third-party help page.
      render: text
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in implementing this.
